<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Trang ca nhan</title>
    <link rel="stylesheet" href="css/trangcanhan.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <h2>QUAN LY NHA TRO</h2>
        <div class="user">Xin chao, <span id="helloUser"></span></div>

        <ul class="menu">
            <li class="active"><a href="trangcanhan.html">Trang ca nhan</a></li>
            <li><a href="tranghopdong.html">Hop dong</a></li>
            <li><a href="tranghoadon.html">Hoa don</a></li>
            <li><a href="trangchisodien.html">Chi so</a></li>
            <li><a href="trangthanhtoan.html">Thanh toan</a></li>
        </ul>

        <div class="logout" id="logoutBtn">Dang xuat</div>
    </aside>

    <main class="main">
        <div class="page-header">
            <div>
                <h1>Thong tin ca nhan</h1>
                <div class="subtext">Thong tin tai khoan va phong dang o</div>
            </div>
        </div>

        <section class="profile-hero">
            <div class="profile-avatar" id="profileInitials">--</div>
            <div class="profile-hero-main">
                <h2 id="profileName">Dang tai...</h2>
                <p id="profileUsername">-</p>
            </div>
            <div class="profile-hero-meta">
                <span id="profileStatus" class="profile-pill profile-pill-status">-</span>
                <span id="profileRoomTag" class="profile-pill profile-pill-room">Chua co hop dong</span>
            </div>
        </section>

        <section class="profile-section">
            <h3>Chi tiet</h3>
            <div class="profile-grid">
                <div class="profile-item">
                    <label>Ho va ten</label>
                    <div class="profile-value" id="fullName"></div>
                </div>
                <div class="profile-item">
                    <label>Email</label>
                    <div class="profile-value" id="email"></div>
                </div>
                <div class="profile-item">
                    <label>So dien thoai</label>
                    <div class="profile-value" id="phone"></div>
                </div>
                <div class="profile-item">
                    <label>CCCD</label>
                    <div class="profile-value" id="cccd"></div>
                </div>
                <div class="profile-item">
                    <label>Ngay sinh</label>
                    <div class="profile-value" id="dob"></div>
                </div>
                <div class="profile-item">
                    <label>Gioi tinh</label>
                    <div class="profile-value" id="gender"></div>
                </div>
                <div class="profile-item profile-item-span">
                    <label>Dia chi</label>
                    <div class="profile-value" id="address"></div>
                </div>
                <div class="profile-item">
                    <label>Ten dang nhap</label>
                    <div class="profile-value" id="username"></div>
                </div>
                <div class="profile-item">
                    <label>Trang thai tai khoan</label>
                    <div class="profile-value" id="tenantStatus"></div>
                </div>
                <div class="profile-item">
                    <label>Phong hien tai</label>
                    <div class="profile-value" id="room"></div>
                </div>
                <div class="profile-item">
                    <label>Vai tro trong phong</label>
                    <div class="profile-value" id="roleInRoom"></div>
                </div>
                <div class="profile-item">
                    <label>Ngay tao tai khoan</label>
                    <div class="profile-value" id="createdAt"></div>
                </div>
            </div>
        </section>
    </main>
</div>

<script src="../js/config.js?v=20260508port8087fix2"></script>
<script src="../js/core/auth-session.js?v=20260508sessionfix1"></script>
<script src="js/auth.js?v=20260508authhotfix2"></script>
<script src="js/trangcanhan.js?v=20260513profileui1"></script>
</body>
</html>
