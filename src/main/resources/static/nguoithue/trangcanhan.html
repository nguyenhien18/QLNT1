<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Trang cá nhân</title>
    <link rel="stylesheet" href="css/trangcanhan.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <h2>QUẢN LÝ NHÀ TRỌ</h2>
        <div class="user">Xin chào, <span id="helloUser"></span></div>

        <ul class="menu">
            <li class="active"><a href="trangcanhan.html">Trang cá nhân</a></li>
            <li><a href="tranghopdong.html">Hợp đồng</a></li>
            <li><a href="tranghoadon.html">Hóa đơn</a></li>
            <li><a href="trangchisodien.html">Chỉ số</a></li>
            <li><a href="trangthanhtoan.html">Thanh toán</a></li>
        </ul>

        <div class="logout" id="logoutBtn">Đăng xuất</div>
    </aside>

    <main class="main">
        <h1>Thông tin cá nhân</h1>

        <section class="profile-card">
            <div class="profile-grid">
                <div class="profile-item">
                    <label>Họ và tên</label>
                    <div id="fullName"></div>
                </div>

                <div class="profile-item">
                    <label>Email</label>
                    <div id="email"></div>
                </div>

                <div class="profile-item">
                    <label>Số điện thoại</label>
                    <div id="phone"></div>
                </div>

                <div class="profile-item">
                    <label>CCCD</label>
                    <div id="cccd"></div>
                </div>

                <div class="profile-item">
                    <label>Địa chỉ</label>
                    <div id="address"></div>
                </div>

                <div class="profile-item">
                    <label>Ngày sinh</label>
                    <div id="dob"></div>
                </div>

                <div class="profile-item">
                    <label>Giới tính</label>
                    <div id="gender"></div>
                </div>

                <div class="profile-item">
                    <label>Tên đăng nhập</label>
                    <div id="username"></div>
                </div>

                <div class="profile-item">
                    <label>Phòng hiện tại</label>
                    <div id="room"></div>
                </div>

                <div class="profile-item">
                    <label>Vai trò trong phòng</label>
                    <div id="roleInRoom"></div>
                </div>
            </div>
        </section>
    </main>
</div>

<script src="../js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/trangcanhan.js"></script>
</body>
</html>
