spring.application.name=QLPT

server.port=8086

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quanli_nha_tro6?useSSL=false&serverTimezone=Asia/Bangkok&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:your_db_user}
spring.datasource.password=${DB_PASSWORD:your_db_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

spring.jackson.time-zone=Asia/Bangkok
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:your_jwt_secret}
jwt.expiration=86400000
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8086,http://127.0.0.1:8086,http://localhost:5500,http://127.0.0.1:5500}
